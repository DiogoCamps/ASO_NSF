<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de RH - ASO | NSF</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f2f5f9; color: #1e293b; font-size: 15px; line-height: 1.5;
    }

    /* ===== IDENTIDADE VISUAL NSF ===== */
    .barra-marca {
      height: 6px;
      background: linear-gradient(90deg, #0057a8 0%, #009b4d 33%, #f78f1e 66%, #ffc20e 100%);
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
    }

    #telaLogin { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card-login {
      background: white; padding: 40px; border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 360px;
      border-top: 4px solid #0057a8;
    }
    .card-login .marca { text-align: center; font-size: 30px; font-weight: 800; color: #0057a8; letter-spacing: 2px; margin-bottom: 4px; }
    .card-login .subtitulo { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 22px; }
    input, select {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: #0057a8; box-shadow: 0 0 0 3px rgba(0,87,168,0.15); }
    button {
      padding: 12px; border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; background: #0057a8; color: white;
      font-family: inherit; transition: background 0.15s;
    }
    button:hover { background: #00407f; }
    .erro { color: #dc2626; font-size: 13px; margin-top: 8px; text-align: center; }
    #telaPrincipal { display: none; padding: 24px 20px 20px; max-width: 1200px; margin: 0 auto; }
    .topo {
      display: flex; justify-content: space-between; align-items: center;
      background: white; padding: 16px 24px; border-radius: 14px;
      margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 4px solid #009b4d;
    }
    .topo h1 { font-size: 20px; color: #0057a8; font-weight: 700; }
    .topo h1 span { color: #f78f1e; }
    .topo button { width: auto; padding: 8px 16px; background: #ef4444; }
    .topo button:hover { background: #dc2626; }
    .abas { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .abas button {
      width: auto; padding: 10px 22px; background: #e2e8f0;
      color: #475569; font-weight: 600; border-radius: 999px;
    }
    .abas button:hover { background: #cbd5e1; }
    .abas button.ativa { background: #0057a8; color: white; }
    .barra-acoes { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .barra-acoes button { width: auto; padding: 10px 18px; }
    .barra-acoes .btn-verde { background: #009b4d; }
    .barra-acoes .btn-verde:hover { background: #00753a; }
    .barra-acoes .btn-cinza { background: #64748b; }
    .barra-acoes .btn-cinza:hover { background: #475569; }
    .barra-acoes input { width: 280px; margin-bottom: 0; }
    .contador { font-size: 13px; color: #64748b; margin-bottom: 10px; }
    .tabela-wrapper { background: white; border-radius: 14px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
    th { background: #f8fafc; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
    tr:hover { background: #f8fafc; }
    .etiqueta { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .etq-atrasado { background: #fee2e2; color: #dc2626; }
    .etq-atencao { background: #fef3c7; color: #d97706; }
    .etq-semperiodico { background: #e2e8f0; color: #64748b; }
    .etq-emdia { background: #d1fae5; color: #00753a; }
    .acao { padding: 6px 12px; font-size: 12px; border-radius: 6px; margin-right: 4px; font-weight: 600; }
    .acao-editar { background: #0057a8; }
    .acao-aso { background: #009b4d; }
    .acao-excluir { background: #ef4444; }
    .acao-reativar { background: #009b4d; }
    .aviso { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; display: none; }
    .modal-fundo {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15,23,42,0.5); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-fundo.aberto { display: flex; }
    .modal {
      background: white; padding: 28px; border-radius: 14px; width: 100%;
      max-width: 420px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      border-top: 4px solid #0057a8;
    }
    .modal h2 { font-size: 18px; color: #0057a8; margin-bottom: 16px; }
    .modal label { display: block; font-size: 13px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
    .modal .linha-botoes { display: flex; gap: 8px; margin-top: 8px; }
    .modal .linha-botoes button { flex: 1; }
    .modal .btn-cancelar { background: #94a3b8; }
    .modal .btn-cancelar:hover { background: #64748b; }

    /* ===== GRADE DE SETORES ===== */
    .grade-setores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
    @media (max-width: 900px) { .grade-setores { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grade-setores { grid-template-columns: 1fr; } }
    .card-setor {
      background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;
    }
    .card-setor::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #0057a8 0%, #009b4d 50%, #f78f1e 100%);
      opacity: 0.85;
    }
    .card-setor:hover { border-color: #0057a8; box-shadow: 0 8px 24px rgba(0,87,168,0.14); transform: translateY(-2px); }
    .cabecalho-card { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .nome-setor { font-size: 16px; font-weight: 700; color: #0057a8; }
    .total-setor { font-size: 13px; color: #475569; font-weight: 600; background: #f1f5f9; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .linha-contadores { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .mini-contador { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #f8fafc; border-radius: 10px; padding: 10px 6px; }
    .mini-contador .num { font-size: 26px; font-weight: 800; line-height: 1.1; }
    .mini-contador .rot { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .cor-vermelho { color: #dc2626; }
    .cor-amarelo { color: #d97706; }
    .cor-cinza { color: #64748b; }
    .cor-verde { color: #009b4d; }
    .expandir-btn {
      width: 100%; padding: 12px; background: white; color: #0057a8;
      border: 2px solid #cfe3f5; border-radius: 12px; font-weight: 700;
      font-size: 14px; margin-bottom: 16px; transition: background 0.15s;
    }
    .expandir-btn:hover { background: #eff6ff; }
    .voltarbtn { width: auto; padding: 10px 18px; background: #64748b; margin-bottom: 12px; display: none; }
    .voltarbtn:hover { background: #475569; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; top: 28px; left: 50%;
      transform: translateX(-50%) translateY(-24px);
      background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
      z-index: 200; max-width: 90%; text-align: center;
    }
    .toast.mostrar { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== MODAL DE CONFIRMAÇÃO ===== */
    .modal-confirm { max-width: 380px; }
    .modal-confirm p { font-size: 15px; color: #334155; margin-bottom: 22px; line-height: 1.5; }

    .dica-codigo { font-size: 12px; color: #64748b; background: #f1f5f9; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="barra-marca"></div>

  <!-- TELA DE LOGIN -->
  <div id="telaLogin">
    <div class="card-login">
      <div class="marca">NSF</div>
      <div class="subtitulo">Sistema de RH - ASO</div>
      <input type="email" id="campoEmail" placeholder="Seu e-mail" autocomplete="email">
      <input type="password" id="campoSenha" placeholder="Sua senha" autocomplete="current-password">
      <button onclick="entrar()">Entrar</button>
      <div class="erro" id="mensagemErro"></div>
    </div>
  </div>

  <!-- TELA PRINCIPAL -->
  <div id="telaPrincipal">
    <div class="topo">
      <h1>Registro de ASO <span>| NSF</span></h1>
      <button onclick="sair()">Sair</button>
    </div>

    <div class="abas">
      <button onclick="trocarAba('ativos')" id="aba-ativos">Ativos</button>
      <button onclick="trocarAba('historico')" id="aba-historico">Histórico</button>
      <button onclick="trocarAba('setores')" id="aba-setores">Setores</button>
      <button onclick="trocarAba('inativos')" id="aba-inativos">Inativos</button>
    </div>

    <div class="aviso" id="avisoDiagnostico">
      Os campos de ASO não foram encontrados nos dados.
      <button style="width:auto;padding:4px 12px;font-size:12px;margin-left:6px;" onclick="diagnostico()">Ver campos no console (F12)</button>
    </div>

    <div class="barra-acoes" id="barraAcoes"></div>

    <div class="grade-setores" id="gradeSetores"></div>

    <button class="expandir-btn" id="btnExpandir" onclick="alternarExpandir()" style="display:none;"></button>

    <button class="voltarbtn" id="btnVoltar" onclick="voltarGrade()">Voltar para todos os setores</button>

    <div class="contador" id="contador"></div>

    <div class="tabela-wrapper" id="tabelaWrapper" style="display:none;">
      <table id="tabelaDados">
        <thead id="cabecalhoTabela"></thead>
        <tbody id="corpoTabela"></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="avisoToast"><span class="toast-texto"></span></div>

  <div class="modal-fundo" id="modalConfirm">
    <div class="modal modal-confirm">
      <h2>Confirmar</h2>
      <p id="confirmTexto"></p>
      <div class="linha-botoes">
        <button class="btn-cancelar" id="confirmNao">Cancelar</button>
        <button id="confirmSim" style="background:#ef4444;">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: FUNCIONÁRIO (sem campo de código) -->
  <div class="modal-fundo" id="modalFuncionario">
    <div class="modal">
      <h2 id="tituloModalFuncionario">Novo Funcionário</h2>
      <div class="dica-codigo" id="dicaCodigo">O código do funcionário será gerado automaticamente pelo sistema.</div>
      <label>Nome completo</label>
      <input type="text" id="funcNome" placeholder="Nome do funcionário">
      <label>Setor</label>
      <select id="funcSetor"></select>
      <div class="linha-botoes">
        <button class="btn-cancelar" onclick="fecharModal('modalFuncionario')">Cancelar</button>
        <button onclick="salvarFuncionario()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: LANÇAR / EDITAR ASO -->
  <div class="modal-fundo" id="modalAso">
    <div class="modal">
      <h2 id="tituloModalAso">Lançar ASO</h2>
      <label>Funcionário</label>
      <select id="asoFuncionarioSelect" style="display:none;"></select>
      <input type="text" id="asoFuncionarioNome" readonly style="background:#f1f5f9;">
      <label>Tipo do ASO</label>
      <select id="asoTipo">
        <option value="Periódico">Periódico</option>
        <option value="Admissional">Admissional</option>
        <option value="Demissional">Demissional</option>
        <option value="Mudança de função">Mudança de função</option>
      </select>
      <label>Data do exame</label>
      <input type="date" id="asoData">
      <label>Validade (meses)</label>
      <input type="number" id="asoValidadeMeses" min="1" placeholder="Ex.: 12">
      <label>Observação (opcional)</label>
      <input type="text" id="asoObservacao" placeholder="Ex.: exame realizado na clínica X">
      <div class="linha-botoes">
        <button class="btn-cancelar" onclick="fecharModal('modalAso')">Cancelar</button>
        <button onclick="salvarAso()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: SETOR -->
  <div class="modal-fundo" id="modalSetor">
    <div class="modal">
      <h2 id="tituloModalSetor">Novo Setor</h2>
      <label>Nome do setor</label>
      <input type="text" id="setorNome" placeholder="Ex.: Produção">
      <label>Validade do ASO (meses)</label>
      <input type="number" id="setorValidadeMeses" min="1" placeholder="Ex.: 12">
      <div class="linha-botoes">
        <button class="btn-cancelar" onclick="fecharModal('modalSetor')">Cancelar</button>
        <button onclick="salvarSetor()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIGURAÇÃO DO FIREBASE =====
    const firebaseConfig = {
      apiKey: "AIzaSyDvrZJKT5rRYfefJ06xFPMzOsp-AgzxC64",
      authDomain: "aso-nsf.firebaseapp.com",
      projectId: "aso-nsf",
      storageBucket: "aso-nsf.firebasestorage.app",
      messagingSenderId: "538373127555",
      appId: "1:538373127555:web:0bbd585e28b5ecad258ab6"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const MESES_PADRAO = 12;        // validade padrão quando nada é definido
    const CARDS_PADRAO = 15;        // 5 fileiras x 3 cards

    let abaAtual = 'ativos';
    let setorSelecionado = null;
    let expandido = false;
    let funcionarioEditandoId = null;
    let codigoEditando = null;      // guarda o código do funcionário em edição
    let asoEditandoId = null;
    let setorEditandoId = null;
    let asoFuncionarioId = null;
    let cacheAtivos = [];
    let cacheHistorico = [];
    let cacheSetores = [];
    let indice = null;
    let logouDiagnostico = false;

    // ===== AVISOS E CONFIRMAÇÃO =====
    function avisar(mensagem) {
      var el = document.getElementById('avisoToast');
      el.querySelector('.toast-texto').textContent = mensagem;
      el.classList.add('mostrar');
      clearTimeout(el._timer);
      el._timer = setTimeout(function() { el.classList.remove('mostrar'); }, 3500);
    }

    function confirmar(mensagem) {
      return new Promise(function(resolve) {
        var m = document.getElementById('modalConfirm');
        document.getElementById('confirmTexto').textContent = mensagem;
        m.classList.add('aberto');
        document.getElementById('confirmSim').onclick = function() { m.classList.remove('aberto'); resolve(true); };
        document.getElementById('confirmNao').onclick = function() { m.classList.remove('aberto'); resolve(false); };
      });
    }

    // ===== LOGIN / LOGOUT =====
    firebase.auth().onAuthStateChanged(function(usuario) {
      if (usuario) {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPrincipal').style.display = 'block';
        trocarAba('ativos');
      } else {
        document.getElementById('telaLogin').style.display = 'flex';
        document.getElementById('telaPrincipal').style.display = 'none';
      }
    });

    function entrar() {
      var email = document.getElementById('campoEmail').value;
      var senha = document.getElementById('campoSenha').value;
      document.getElementById('mensagemErro').textContent = '';
      auth.signInWithEmailAndPassword(email, senha).catch(function(erro) {
        document.getElementById('mensagemErro').textContent = traduzirErro(erro.code);
      });
    }

    function sair() { auth.signOut(); }

    function traduzirErro(codigo) {
      if (codigo === 'auth/wrong-password') return 'Senha incorreta.';
      if (codigo === 'auth/user-not-found') return 'E-mail não cadastrado.';
      if (codigo === 'auth/invalid-email') return 'E-mail inválido.';
      if (codigo === 'auth/too-many-requests') return 'Muitas tentativas. Tente mais tarde.';
      return 'Erro ao entrar. Verifique e-mail e senha.';
    }

    // ===== GERAÇÃO AUTOMÁTICA DE CÓDIGO =====
    // Cria um código numérico único para o funcionário.
    // Verifica se já existe na lista de ativos para evitar repetição.
    function gerarCodigoUnico() {
      var usados = {};
      cacheAtivos.forEach(function(f) {
        var c = lerCodigo(f);
        if (c) usados[normalizar(c)] = true;
      });
      var tentativas = 0;
      while (tentativas < 1000) {
        var codigo = String(Math.floor(100000 + Math.random() * 900000)); // 6 dígitos
        if (!usados[codigo]) return codigo;
        tentativas++;
      }
      // Fallback bem improvável: usa o horário atual
      return String(Date.now()).slice(-6);
    }

    // ===== DETECÇÃO DE CAMPOS =====
    function normalizar(texto) {
      return String(texto)
        .toLowerCase()
        .replace(/[áàâãä]/g, 'a').replace(/[éèêë]/g, 'e')
        .replace(/[íìîï]/g, 'i').replace(/[óòôõö]/g, 'o')
        .replace(/[úùûü]/g, 'u').replace(/ç/g, 'c')
        .replace(/[^a-z0-9]/g, '');
    }

    function chaveCampo(registro, palavras) {
      var chaves = Object.keys(registro);
      for (var i = 0; i < chaves.length; i++) {
        var cn = normalizar(chaves[i]);
        if (cn === '__id') continue;
        for (var j = 0; j < palavras.length; j++) {
          if (cn.indexOf(normalizar(palavras[j])) !== -1) return chaves[i];
        }
      }
      return null;
    }

    function lerCampo(registro, palavras) {
      var chave = chaveCampo(registro, palavras);
      return chave ? registro[chave] : null;
    }

    function paraData(valor) {
      if (!valor) return null;
      if (valor instanceof Date) return valor;
      if (typeof valor.toDate === 'function') return valor.toDate();
      if (typeof valor === 'string' && valor !== '') {
        var d = new Date(valor);
        if (!isNaN(d.getTime())) return d;
      }
      return null;
    }

    function lerNome(reg)   { var v = lerCampo(reg, ['nome', 'funcionario', 'colaborador', 'empregado', 'servidor']); return v ? String(v) : ''; }
    function lerSetor(reg)  { var v = lerCampo(reg, ['setor', 'departamento', 'area']); return v ? String(v) : ''; }
    function lerCodigo(reg) { var v = lerCampo(reg, ['codigo', 'matricula', 'matr', 'chapa', 'registro', 'cracha', 'cod']); return v ? String(v) : ''; }
    function lerTipo(reg)   { var v = lerCampo(reg, ['tipo', 'tipaso', 'tipodeaso', 'tipoaso']); return v ? String(v) : ''; }
    function lerDataExame(reg) { return paraData(lerCampo(reg, ['ultimoexame', 'ultimaexame', 'dataexame', 'dataaso', 'exame', 'aso', 'data'])); }
    function lerVenceEm(reg)   { return paraData(lerCampo(reg, ['venceem', 'vencimento', 'proximoexame', 'validade', 'vence', 'venc', 'datavencimento'])); }
    function lerStatusReg(reg) { var v = lerCampo(reg, ['status', 'situacao', 'estado']); return v ? String(v) : ''; }
    function lerObservacao(reg){ var v = lerCampo(reg, ['observacao', 'obs', 'nota']); return v ? String(v) : ''; }

    // Validade em meses de um setor
    function mesesDoSetor(nomeSetor) {
      for (var i = 0; i < cacheSetores.length; i++) {
        var s = cacheSetores[i];
        if ((lerCampo(s, ['nome', 'setor']) || '') === nomeSetor && s.validadeMeses) {
          return Number(s.validadeMeses);
        }
      }
      return null;
    }

    // Validade em meses de um ASO
    function mesesValidadeDoAso(aso, funcionario) {
      if (aso && aso.validadeMeses) return Number(aso.validadeMeses);
      if (funcionario) {
        var m = mesesDoSetor(lerSetor(funcionario));
        if (m) return m;
      }
      return MESES_PADRAO;
    }

    // ===== ÍNDICE DE ATIVOS =====
    function indiceAtivos() {
      if (indice) return indice;
      var porCodigo = {};
      var porNome = {};
      cacheAtivos.forEach(function(f) {
        var nome = lerNome(f);
        var cod = normalizar(lerCodigo(f));
        if (cod) porCodigo[cod] = nome;
        if (nome) porNome[normalizar(nome)] = nome;
      });
      indice = { codigo: porCodigo, nome: porNome };
      return indice;
    }

    // ===== NOME DO FUNCIONÁRIO NUM LANÇAMENTO =====
    function nomeDoAso(r) {
      var idx = indiceAtivos();

      var fid = r.funcionarioId || r.funcionario_id || r.idFuncionario || r.id_funcionario ||
                r.colaboradorId || r.colaborador_id || null;
      if (fid) {
        for (var i = 0; i < cacheAtivos.length; i++) {
          if (cacheAtivos[i].__id === fid) {
            var nId = lerNome(cacheAtivos[i]);
            if (nId) return nId;
          }
        }
      }

      var nome = lerNome(r);
      if (nome && !idx.codigo[normalizar(nome)]) return nome;

      var chaves = Object.keys(r);
      for (var k = 0; k < chaves.length; k++) {
        if (chaves[k] === '__id') continue;
        var v = r[chaves[k]];
        if (v === null || v === undefined || typeof v === 'object') continue;
        var vs = normalizar(v);
        if (vs && idx.codigo[vs]) return idx.codigo[vs];
      }

      for (var k2 = 0; k2 < chaves.length; k2++) {
        if (chaves[k2] === '__id') continue;
        var v2 = r[chaves[k2]];
        if (v2 === null || v2 === undefined || typeof v2 === 'object') continue;
        var vs2 = normalizar(v2);
        if (vs2 && idx.nome[vs2]) return idx.nome[vs2];
      }

      if (!logouDiagnostico) {
        logouDiagnostico = true;
        console.warn('Nao foi possivel achar o nome do funcionario neste lancamento. Campos disponiveis:', Object.keys(r), r);
      }

      return nome || '';
    }

    // ===== JUNÇÃO: funcionário + ASO mais recente =====
    function acharAsoDoFuncionario(funcionario) {
      var codigo = normalizar(lerCodigo(funcionario));
      var nome = normalizar(lerNome(funcionario));
      var achados = [];

      cacheHistorico.forEach(function(aso) {
        var codAso = normalizar(lerCodigo(aso));
        var nomeAso = normalizar(nomeDoAso(aso));
        if (codigo && codAso && codigo === codAso) { achados.push(aso); return; }
        if (nome && nomeAso && nome === nomeAso) { achados.push(aso); return; }
      });

      if (achados.length === 0) return null;

      achados.sort(function(a, b) {
        var da = lerDataExame(a); var db2 = lerDataExame(b);
        if (!da && !db2) return 0;
        if (!da) return 1;
        if (!db2) return -1;
        return db2.getTime() - da.getTime();
      });
      return achados[0];
    }

    // ===== STATUS =====
    function statusDoFuncionario(funcionario) {
      var aso = acharAsoDoFuncionario(funcionario);
      if (!aso) return 'Sem periódico';
      var tipo = normalizar(lerTipo(aso));
      if (tipo.indexOf('demiss') !== -1) return 'Sem periódico';
      var dataExame = lerDataExame(aso);
      if (!dataExame) return 'Sem periódico';
      var vence = lerVenceEm(aso);
      if (!vence) {
        vence = new Date(dataExame);
        vence.setMonth(vence.getMonth() + mesesValidadeDoAso(aso, funcionario));
      }
      var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      var diff = Math.ceil((vence.getTime() - hoje.getTime()) / 86400000);
      if (diff < 0) return 'Atrasado';
      if (diff <= 30) return 'Atenção';
      return 'Em dia';
    }

    function dadosAsoDoFuncionario(funcionario) {
      var aso = acharAsoDoFuncionario(funcionario);
      var dataExame = aso ? lerDataExame(aso) : null;
      var vence = aso ? lerVenceEm(aso) : null;
      if (aso && dataExame && !vence) {
        vence = new Date(dataExame);
        vence.setMonth(vence.getMonth() + mesesValidadeDoAso(aso, funcionario));
      }
      var dias = '';
      if (vence) {
        var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
        var diff = Math.ceil((vence.getTime() - hoje.getTime()) / 86400000);
        dias = diff < 0 ? ('Vencido há ' + Math.abs(diff) + 'd') : (diff === 0 ? 'Vence hoje' : diff + ' dias');
      }
      return { aso: aso, dataExame: dataExame, vence: vence, dias: dias };
    }

    // ===== CARREGAMENTO =====
    function carregarTudo() {
      Promise.all([
        db.collection('ativos').get(),
        db.collection('historico').get(),
        db.collection('setores').get()
      ]).then(function(resultados) {
        cacheAtivos = resultados[0].docs.map(function(d) { var x = d.data(); x.__id = d.id; return x; });
        cacheHistorico = resultados[1].docs.map(function(d) { var x = d.data(); x.__id = d.id; return x; });
        cacheSetores = resultados[2].docs.map(function(d) { var x = d.data(); x.__id = d.id; return x; });

        indice = null;

        if (abaAtual === 'ativos') montarGradeSetores(cacheAtivos);
        else if (abaAtual === 'historico') montarTabelaHistorico(cacheHistorico);
        else if (abaAtual === 'setores') montarTabelaSetores(cacheSetores);
        else if (abaAtual === 'inativos') db.collection('inativos').get().then(function(res) {
          var inativos = res.docs.map(function(d) { var x = d.data(); x.__id = d.id; return x; });
          montarTabelaInativos(inativos);
        });

        verificarDiagnostico();
      }).catch(function(erro) {
        console.error('Erro ao carregar:', erro);
        document.getElementById('corpoTabela').innerHTML =
          '<tr><td>Erro ao carregar dados. Verifique se você está logado com o e-mail autorizado.</td></tr>';
      });
    }

    // ===== GRADE DE SETORES =====
    function montarGradeSetores(registros) {
      document.getElementById('tabelaWrapper').style.display = 'none';
      document.getElementById('btnVoltar').style.display = 'none';
      document.getElementById('gradeSetores').style.display = 'grid';

      var campo = document.getElementById('campoBusca');
      var termo = campo && campo.value ? normalizar(campo.value) : '';
      var lista = registros;
      if (termo) {
        lista = registros.filter(function(f) {
          return normalizar(lerNome(f)).indexOf(termo) !== -1 ||
                 normalizar(lerSetor(f)).indexOf(termo) !== -1 ||
                 normalizar(lerCodigo(f)).indexOf(termo) !== -1;
        });
      }

      var porSetor = {};
      lista.forEach(function(f) {
        var setor = lerSetor(f) || 'Sem setor';
        if (!porSetor[setor]) porSetor[setor] = [];
        porSetor[setor].push(f);
      });

      var nomesSetores = Object.keys(porSetor).sort();
      var cards = [];

      nomesSetores.forEach(function(setor) {
        var funcs = porSetor[setor];
        var cont = { 'Atrasado': 0, 'Atenção': 0, 'Sem periódico': 0, 'Em dia': 0 };
        funcs.forEach(function(f) { cont[statusDoFuncionario(f)]++; });

        var c = '';
        c += '<div class="card-setor" onclick="abrirSetor(\'' + escaparAspas(setor) + '\')">';
        c += '<div class="cabecalho-card"><div class="nome-setor">' + formatarValor(setor) + '</div>';
        c += '<div class="total-setor">' + funcs.length + '</div></div>';
        c += '<div class="linha-contadores">';
        c += '<div class="mini-contador"><div class="num cor-vermelho">' + cont['Atrasado'] + '</div><div class="rot">Atrasado</div></div>';
        c += '<div class="mini-contador"><div class="num cor-amarelo">' + cont['Atenção'] + '</div><div class="rot">30 dias</div></div>';
        c += '<div class="mini-contador"><div class="num cor-cinza">' + cont['Sem periódico'] + '</div><div class="rot">Sem per.</div></div>';
        c += '<div class="mini-contador"><div class="num cor-verde">' + cont['Em dia'] + '</div><div class="rot">Em dia</div></div>';
        c += '</div></div>';
        cards.push(c);
      });

      var btnExpandir = document.getElementById('btnExpandir');
      var visiveis = cards;
      if (cards.length > CARDS_PADRAO) {
        btnExpandir.style.display = 'block';
        if (expandido) {
          btnExpandir.textContent = 'Ver menos setores';
        } else {
          visiveis = cards.slice(0, CARDS_PADRAO);
          btnExpandir.textContent = 'Ver mais setores (' + (cards.length - CARDS_PADRAO) + ')';
        }
      } else {
        btnExpandir.style.display = 'none';
      }

      var html = visiveis.join('');
      if (cards.length === 0) {
        html = '<div style="background:white;border-radius:14px;padding:20px;text-align:center;color:#64748b;">Nenhum funcionário encontrado.</div>';
      }

      document.getElementById('gradeSetores').innerHTML = html;
      document.getElementById('contador').textContent = lista.length + ' registro(s)';
    }

    function escaparAspas(texto) {
      return String(texto).replace(/'/g, "\'").replace(/"/g, '&quot;');

      if (typeof valor === 'object') return JSON.stringify(valor);

    // ===== MODAIS =====
    function abrirModal(id) { document.getElementById(id).classList.add('aberto'); }
    function fecharModal(id) { document.getElementById(id).classList.remove('aberto'); }

    // ----- Funcionário -----
    function abrirModalFuncionario(id) {
      funcionarioEditandoId = id || null;
      codigoEditando = null;
      document.getElementById('funcNome').value = '';
      document.getElementById('tituloModalFuncionario').textContent = id ? 'Editar Funcionário' : 'Novo Funcionário';
      document.getElementById('dicaCodigo').textContent = id
        ? 'O código do funcionário é gerado pelo sistema e não pode ser alterado.'
        : 'O código do funcionário será gerado automaticamente pelo sistema.';

      var select = document.getElementById('funcSetor');
      var html = '<option value="">Selecione o setor...</option>';
      cacheSetores.forEach(function(s) {
        var nome = lerCampo(s, ['nome', 'setor']) || '';
        html += '<option value="' + nome + '">' + nome + '</option>';
      });
      select.innerHTML = html;

      if (id) {
        db.collection('ativos').doc(id).get().then(function(doc) {
          if (doc.exists) {
            var r = doc.data();
            document.getElementById('funcNome').value = lerNome(r);
            codigoEditando = lerCodigo(r);   // preserva o código atual
            setTimeout(function() { document.getElementById('funcSetor').value = lerSetor(r); }, 200);
          }
        });
      }
      abrirModal('modalFuncionario');
    }

    function salvarFuncionario() {
      var nome = document.getElementById('funcNome').value.trim();
      var setor = document.getElementById('funcSetor').value;
      if (!nome) { avisar('Informe o nome do funcionário.'); return; }

      if (funcionarioEditandoId) {
        // Edição: mantém o código existente
        var dadosEdicao = {
          nome: nome,
          setor: setor,
          codigo: codigoEditando || gerarCodigoUnico(),
          atualizadoEm: new Date()
        };
        db.collection('ativos').doc(funcionarioEditandoId).update(dadosEdicao)
          .then(function() { fecharModal('modalFuncionario'); carregarTudo(); })
          .catch(function(e) { avisar('Erro ao salvar: ' + e.message); });
      } else {
        // Cadastro novo: o sistema gera o código aleatório
        var codigoNovo = gerarCodigoUnico();
        db.collection('ativos').add({
          nome: nome,
          setor: setor,
          codigo: codigoNovo,
          criadoEm: new Date()
        }).then(function() {
          fecharModal('modalFuncionario');
          carregarTudo();
          avisar('Funcionário cadastrado. Código gerado: ' + codigoNovo);
        }).catch(function(e) { avisar('Erro ao salvar: ' + e.message); });
      }
    }

    async function excluirFuncionario(id) {
      var ok = await confirmar('Excluir este funcionário? Ele será movido para a lista de Inativos.');
      if (!ok) return;
      db.collection('ativos').doc(id).get().then(function(doc) {
        if (!doc.exists) return;
        var dados = doc.data();
        delete dados.__id;
        dados.dataExclusao = new Date();
        dados.motivo = 'Excluído do sistema';
        db.collection('inativos').add(dados).then(function() {
          return db.collection('ativos').doc(id).delete();
        }).then(function() { carregarTudo(); })
        .catch(function(e) { avisar('Erro ao excluir: ' + e.message); });
      });
    }

    async function reativarFuncionario(id) {
      var ok = await confirmar('Reativar este funcionário? Ele voltará para a lista de Ativos.');
      if (!ok) return;
      db.collection('inativos').doc(id).get().then(function(doc) {
        if (!doc.exists) return;
        var dados = doc.data();
        delete dados.__id;
        delete dados.dataExclusao;
        delete dados.motivo;
        db.collection('ativos').add(dados).then(function() {
          return db.collection('inativos').doc(id).delete();
        }).then(function() { carregarTudo(); })
        .catch(function(e) { avisar('Erro ao reativar: ' + e.message); });
      });
    }

    // ----- ASO -----
    function abrirModalAsoFuncionario(funcionarioId) {
      asoEditandoId = null;
      asoFuncionarioId = funcionarioId;
      document.getElementById('tituloModalAso').textContent = 'Lançar ASO';
      document.getElementById('asoFuncionarioSelect').style.display = 'none';
      document.getElementById('asoFuncionarioNome').style.display = 'block';
      document.getElementById('asoFuncionarioNome').value = '';
      document.getElementById('asoData').value = '';
      document.getElementById('asoObservacao').value = '';
      document.getElementById('asoTipo').value = 'Periódico';
      document.getElementById('asoValidadeMeses').value = '';

      db.collection('ativos').doc(funcionarioId).get().then(function(doc) {
        if (doc.exists) {
          var f = doc.data();
          document.getElementById('asoFuncionarioNome').value = lerNome(f);
          var m = mesesDoSetor(lerSetor(f));
          document.getElementById('asoValidadeMeses').value = m ? m : MESES_PADRAO;
        }
      });
      abrirModal('modalAso');
    }

    function abrirModalAsoLancamento() {
      asoEditandoId = null;
      asoFuncionarioId = null;
      document.getElementById('tituloModalAso').textContent = 'Lançar ASO';
      document.getElementById('asoFuncionarioNome').style.display = 'none';
      document.getElementById('asoFuncionarioSelect').style.display = 'block';
      document.getElementById('asoData').value = '';
      document.getElementById('asoObservacao').value = '';
      document.getElementById('asoTipo').value = 'Periódico';
      document.getElementById('asoValidadeMeses').value = MESES_PADRAO;

      var select = document.getElementById('asoFuncionarioSelect');
      var html = '<option value="">Selecione o funcionário...</option>';
      cacheAtivos.forEach(function(f) { html += '<option value="' + f.__id + '">' + lerNome(f) + '</option>'; });
      select.innerHTML = html;

      select.onchange = function() {
        var id = select.value;
        for (var i = 0; i < cacheAtivos.length; i++) {
          if (cacheAtivos[i].__id === id) {
            var m = mesesDoSetor(lerSetor(cacheAtivos[i]));
            document.getElementById('asoValidadeMeses').value = m ? m : MESES_PADRAO;
            break;
          }
        }
      };

      abrirModal('modalAso');
    }

    function abrirModalAsoEdicao(asoId) {
      asoEditandoId = asoId;
      document.getElementById('tituloModalAso').textContent = 'Editar ASO';
      document.getElementById('asoFuncionarioSelect').style.display = 'none';
      document.getElementById('asoFuncionarioNome').style.display = 'block';

      db.collection('historico').doc(asoId).get().then(function(doc) {
        if (!doc.exists) return;
        var r = doc.data();
        asoFuncionarioId = r.funcionarioId || r.funcionario_id || null;
        document.getElementById('asoFuncionarioNome').value = nomeDoAso(r);
        document.getElementById('asoTipo').value = r.tipo || 'Periódico';
        document.getElementById('asoValidadeMeses').value = r.validadeMeses || MESES_PADRAO;
        var data = lerDataExame(r);
        if (data) {
          document.getElementById('asoData').value =
            data.getFullYear() + '-' + ('0' + (data.getMonth() + 1)).slice(-2) + '-' + ('0' + data.getDate()).slice(-2);
        }
        document.getElementById('asoObservacao').value = lerObservacao(r);
      });
      abrirModal('modalAso');
    }

    function salvarAso() {
      var tipo = document.getElementById('asoTipo').value;
      var dataStr = document.getElementById('asoData').value;
      var observacao = document.getElementById('asoObservacao').value.trim();
      var validadeMeses = parseInt(document.getElementById('asoValidadeMeses').value, 10);

      if (!dataStr) { avisar('Informe a data do exame.'); return; }
      if (!validadeMeses || validadeMeses < 1) { avisar('Informe a validade em meses (ex.: 12).'); return; }
      var data = new Date(dataStr + 'T12:00:00');

      if (asoEditandoId) {
        db.collection('historico').doc(asoEditandoId).update({
          tipo: tipo, data: data, observacao: observacao, validadeMeses: validadeMeses, atualizadoEm: new Date()
        }).then(function() { fecharModal('modalAso'); carregarTudo(); })
        .catch(function(e) { avisar('Erro ao salvar ASO: ' + e.message); });
        return;
      }

      if (!asoFuncionarioId) {
        asoFuncionarioId = document.getElementById('asoFuncionarioSelect').value;
        if (!asoFuncionarioId) { avisar('Selecione o funcionário.'); return; }
      }

      db.collection('ativos').doc(asoFuncionarioId).get().then(function(doc) {
        if (!doc.exists) { avisar('Funcionário não encontrado.'); return; }
        var funcionario = doc.data();
        return db.collection('historico').add({
          funcionarioId: asoFuncionarioId,
          funcionarioNome: lerNome(funcionario),
          funcionarioCodigo: lerCodigo(funcionario),
          tipo: tipo, data: data, observacao: observacao, validadeMeses: validadeMeses, criadoEm: new Date()
        });
      }).then(function() { fecharModal('modalAso'); carregarTudo(); })
      .catch(function(e) { avisar('Erro ao lançar ASO: ' + e.message); });
    }

    async function excluirAso(asoId) {
      var ok = await confirmar('Excluir este ASO do histórico?');
      if (!ok) return;
      db.collection('historico').doc(asoId).delete()
        .then(function() { carregarTudo(); })
        .catch(function(e) { avisar('Erro ao excluir ASO: ' + e.message); });
    }

    // ----- Setores -----
    function abrirModalSetor(id) {
      setorEditandoId = id || null;
      document.getElementById('setorNome').value = '';
      document.getElementById('setorValidadeMeses').value = '';
      document.getElementById('tituloModalSetor').textContent = id ? 'Editar Setor' : 'Novo Setor';
      if (id) {
        db.collection('setores').doc(id).get().then(function(doc) {
          if (doc.exists) {
            var r = doc.data();
            document.getElementById('setorNome').value = lerCampo(r, ['nome', 'setor']) || '';
            document.getElementById('setorValidadeMeses').value = r.validadeMeses || '';
          }
        });
      }
      abrirModal('modalSetor');
    }

    function salvarSetor() {
      var nome = document.getElementById('setorNome').value.trim();
      var validadeMeses = parseInt(document.getElementById('setorValidadeMeses').value, 10);
      if (!nome) { avisar('Informe o nome do setor.'); return; }
      if (!validadeMeses || validadeMeses < 1) { avisar('Informe a validade do ASO em meses (ex.: 12).'); return; }

      if (setorEditandoId) {
        db.collection('setores').doc(setorEditandoId).update({ nome: nome, validadeMeses: validadeMeses, atualizadoEm: new Date() })
          .then(function() { fecharModal('modalSetor'); carregarTudo(); })
          .catch(function(e) { avisar('Erro ao salvar: ' + e.message); });
      } else {
        db.collection('setores').add({ nome: nome, validadeMeses: validadeMeses, criadoEm: new Date() })
          .then(function() { fecharModal('modalSetor'); carregarTudo(); })
          .catch(function(e) { avisar('Erro ao salvar: ' + e.message); });
      }
    }

    async function excluirSetor(id) {
      var ok = await confirmar('Excluir este setor?');
      if (!ok) return;
      db.collection('setores').doc(id).delete()
        .then(function() { carregarTudo(); })
        .catch(function(e) { avisar('Erro ao excluir: ' + e.message); });
    }
  </script>
</body>
